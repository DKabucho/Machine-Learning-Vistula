seed: 42
dataset:
  name: Craigslist Used Cars
  kaggle_slug: austinreese/craigslist-carstrucks-data
  file: vehicles.csv
  url: https://www.kaggle.com/datasets/austinreese/craigslist-carstrucks-data
dataset_file: data/vehicles.csv
output_dir: results
test_size: 0.2
validation_size: 0.2
target_column: price
minimum_price: 1000
maximum_price: 150000
minimum_year: 1900
maximum_odometer: 500000
latency_target_ms: 50.0
size_target_mb: 5.0
mae_target_usd: 3000.0
models:
  ridge:
    alpha: 10.0
  histogram_gradient_boosting:
    learning_rate: 0.08
    max_iter: 200
    max_depth: 8
    l2_regularization: 1.0
  mlp:
    hidden_sizes: [128, 64]
    epochs: 20
    batch_size: 256
    learning_rate: 0.001
    weight_decay: 0.0001
    optimizer: adam
studies:
  num_workers: [0, 1, 2, 4, 8]
  batch_sizes: [32, 64, 128, 256, 512]
  optimizers: [sgd, adam]
  schedulers: [steplr, cosineannealinglr, reducelronplateau]
  gradient_accumulation:
    effective_batch_size: 256
    micro_batch_size: 64
    accumulation_steps: 4
tracking:
  mlflow_tracking_uri: results/mlruns
